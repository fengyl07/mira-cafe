<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14110f" />
  <title>雨夜 · Mira</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="stage" class="stage" data-status="idle" data-emotion="wary" data-action="hold_cup" data-scene="rain" data-fx="">
    <header class="top">
      <div class="place">
        <strong>城南咖啡馆</strong>
        <span id="mode">打烊前</span>
      </div>
      <div class="status" aria-live="polite">
        <span class="dot"></span>
        <span id="status-label">待机</span>
      </div>
    </header>

    <div class="world">
      <svg viewBox="0 0 400 640" role="img" aria-label="暴雨夜里的咖啡馆，Mira 站在柜台后">
        <rect class="room" width="400" height="640" fill="#2a211f" />
        <rect class="window-glass" x="34" y="26" width="268" height="312" rx="10" fill="#1a4558" />
        <g clip-path="url(#window-clip)">
          <g class="city">
            <rect x="52" y="210" width="22" height="70" fill="#e7c27a" opacity="0.55" />
            <rect x="84" y="176" width="16" height="104" fill="#9ec9d8" opacity="0.35" />
            <rect x="112" y="198" width="28" height="82" fill="#f0d7a4" opacity="0.28" />
            <rect x="156" y="150" width="18" height="130" fill="#d7e7ef" opacity="0.22" />
            <rect x="186" y="188" width="34" height="92" fill="#e8b86d" opacity="0.32" />
            <rect x="232" y="168" width="20" height="112" fill="#b7d5e2" opacity="0.3" />
          </g>
          <rect class="rain" x="34" y="0" width="268" height="360" fill="url(#rain)" />
        </g>
        <rect x="34" y="26" width="268" height="312" rx="10" fill="none" stroke="#6e5340" stroke-width="8" />
        <path d="M168 26 V338" stroke="#6e5340" stroke-width="6" />
        <path d="M34 176 H302" stroke="#6e5340" stroke-width="6" />
        <ellipse class="lamp-glow" cx="336" cy="118" rx="78" ry="64" fill="#f0c27a" opacity="0.38" />
        <path d="M360 36 V92" stroke="#8d6a45" stroke-width="6" stroke-linecap="round" />
        <path d="M360 92 h-28" stroke="#8d6a45" stroke-width="6" stroke-linecap="round" />
        <circle cx="332" cy="92" r="8" fill="#f6deae" />
        <rect x="314" y="286" width="74" height="250" fill="#1a1412" />
        <rect x="326" y="304" width="50" height="78" fill="#c5d5df" opacity="0.28" />
        <circle cx="372" cy="410" r="3" fill="#d7b07a" />

        <g transform="translate(200 404)">
          <g id="mira">
            <path class="hair-back" d="M-46 -8 Q-62 70 -36 118" stroke="#2b2324" stroke-width="18" fill="none" stroke-linecap="round" />
            <path d="M46 -8 Q64 74 38 120" stroke="#2b2324" stroke-width="18" fill="none" stroke-linecap="round" />
            <path class="coat" d="M-78 28 L-90 168 L90 168 L78 28 Q42 62 0 70 Q-42 62 -78 28 Z" fill="#d4843c" />
            <path d="M-18 40 L0 168 L18 40 Q0 64 -18 40 Z" fill="#f0c48a" />
            <path d="M-78 28 Q0 58 78 28" fill="none" stroke="#8d4e22" stroke-width="8" />
            <circle cx="0" cy="-18" r="48" fill="#f0cfc0" />
            <path d="M-50 -24 Q-52 -86 0 -90 Q52 -86 50 -24 Q28 -58 0 -46 Q-28 -58 -50 -24 Z" fill="#32282a" />
            <polygon class="star" points="34,-70 38,-58 50,-58 40,-50 44,-38 34,-46 24,-38 28,-50 18,-58 30,-58" fill="#e7eef6" />
            <g class="brows" fill="none" stroke="#3a2c2c" stroke-width="2.6" stroke-linecap="round">
              <path d="M-28 -40 L-10 -36" />
              <path d="M10 -36 L28 -40" />
            </g>
            <g class="eyes">
              <g class="pupils">
                <ellipse cx="-16" cy="-22" rx="4.6" ry="5.6" fill="#241c1c" />
                <ellipse cx="16" cy="-22" rx="4.6" ry="5.6" fill="#241c1c" />
              </g>
            </g>
            <path class="mouth smile" d="M-12 -6 Q0 6 12 -6" stroke="#8a3d42" stroke-width="2.6" fill="none" stroke-linecap="round" />
            <path class="mouth flat" d="M-11 -4 H11" stroke="#8a3d42" stroke-width="2.6" fill="none" stroke-linecap="round" />
            <path class="mouth frown" d="M-12 -2 Q0 -12 12 -2" stroke="#8a3d42" stroke-width="2.6" fill="none" stroke-linecap="round" />
            <ellipse class="mouth talk" cx="0" cy="-4" rx="7" ry="5.5" fill="#8a3d42" />
            <text class="think" x="62" y="-72" font-size="28" fill="#f6efe4">…</text>
            <g class="cup">
              <rect x="48" y="78" width="24" height="28" rx="4" fill="#f7f3ec" />
              <path d="M72 84 h8 a8 8 0 0 1 0 16 h-8" fill="none" stroke="#f7f3ec" stroke-width="3" />
            </g>
            <g class="phone">
              <rect x="-70" y="-6" width="16" height="30" rx="3" fill="#171b22" />
              <rect x="-67" y="-1" width="10" height="18" rx="1" fill="#7eb6ff" />
            </g>
          </g>
        </g>

        <rect x="0" y="528" width="400" height="112" fill="#3d291f" />
        <rect x="0" y="516" width="400" height="18" fill="#6b4632" />
        <defs>
          <clipPath id="window-clip">
            <rect x="34" y="26" width="268" height="312" rx="10" />
          </clipPath>
          <pattern id="rain" width="18" height="28" patternUnits="userSpaceOnUse">
            <path d="M8 0 v14" stroke="#d7e8f2" stroke-width="1.5" opacity="0.7" />
          </pattern>
        </defs>
      </svg>

      <div id="clip" hidden>
        <p class="clip-loading">门口的光正在接上</p>
        <div class="clip-scene" aria-hidden="true">
          <div class="beam"></div>
          <div class="visitor"></div>
        </div>
        <p class="clip-fail">这段画面没加载出来</p>
      </div>

      <div class="captions">
        <p id="echo"></p>
        <p id="subtitle" aria-live="polite"></p>
      </div>
    </div>

    <div class="dock" id="dock" hidden>
      <form id="composer">
        <input id="line" maxlength="80" placeholder="说点什么" autocomplete="off" enterkeyhint="send" disabled />
        <button id="send" type="submit" disabled>发送</button>
      </form>
      <button id="talk" type="button" disabled aria-pressed="false">按住说话</button>
      <p class="hint">她说话时按下，就会停下来听你的</p>
      <details class="debug">
        <summary>调试</summary>
        <label><input id="fail-media" type="checkbox" /> 下一次门口画面失败</label>
        <button id="force-timeout" type="button">模拟她没接上话</button>
      </details>
    </div>
  </div>

  <div id="gate">
    <p class="eyebrow">暴雨后的夜晚</p>
    <h1>即将打烊的咖啡馆</h1>
    <p class="lede">Mira 还在等一个人。你可以打字，也可以按住说话。</p>
    <button id="enter" type="button">推门进去</button>
    <p id="gate-error"></p>
  </div>
  <div id="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
